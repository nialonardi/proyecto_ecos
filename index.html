<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma Inteligente de Acompañamiento Proactivo para Adultos Mayores mediante Orquestación Agéntica y Memoria Persistente. UTN FRBA 2026.">
  <title>ECOS - Plataforma Inteligente de Acompañamiento Proactivo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header de Control y Navegación del Sistema -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">E</div>
      <div class="brand-title">
        <h1>Proyecto ECOS</h1>
        <p>Ecosistema Cognitivo de Orquestación Solidaria | UTN FRBA</p>
      </div>
    </div>

    <!-- Navegación de Vistas de la Plataforma -->
    <nav class="view-switcher">
      <button class="nav-btn active" id="btnNavSenior" data-target="seniorView">
        <span>📺 Adulto Mayor (Zero-UI)</span>
      </button>
      <button class="nav-btn" id="btnNavDashboard" data-target="dashboardView">
        <span>👥 Dashboard Familiar</span>
      </button>
      <button class="nav-btn" id="btnNavDevStudio" data-target="devstudioView">
        <span>🧠 DevStudio Orquestador</span>
      </button>
    </nav>
  </header>

  <!-- Contenedor Principal de Vistas -->
  <main class="main-container">
    <!-- Vista 1: Interfaz Zero-UI del Adulto Mayor -->
    <section class="view-panel active" id="seniorView"></section>

    <!-- Vista 2: Dashboard Familiar PWA -->
    <section class="view-panel" id="dashboardView"></section>

    <!-- Vista 3: DevStudio & Monitor de Agentes -->
    <section class="view-panel" id="devstudioView"></section>
  </main>

  <!-- Script Principal ES6 Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
